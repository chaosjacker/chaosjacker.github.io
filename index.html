<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chaosjacker | GitHub主页</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body{
    background-color:#f7f7fb;
    background-image:url("torinoaqua_394aa6b23d9042e18c0026784cad3fbf.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    padding:16px;
    max-width:1080px;
    margin:0 auto;
}
/* 顶部用户信息白色卡片 */
.profile-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:20px;
    padding:30px 24px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
    margin-bottom:16px;
    text-align:center;
}
.avatar-wrap{
    position: relative;
    display: inline-block;
}
.avatar-wrap::before{
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff6ad5, #a78bfa, #4facfe, #43e97b, #ffd86b, #ff6ad5);
    z-index: -1;
    filter: blur(12px);
    opacity: 0;
    transition: opacity 0.3s ease;
    animation: rotateGlow 6s linear infinite;
}
.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    border:4px solid #fff;
    object-fit:cover;
    background:#fff;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    z-index: 2;
}
.avatar-wrap:hover .avatar{
    animation: shake 0.5s ease-in-out;
    box-shadow: 0 0 20px rgba(255,105,210,0.8), 0 0 40px rgba(167,139,250,0.6), 0 0 60px rgba(79,172,254,0.4);
    transform: scale(1.08) rotate(3deg);
}
.avatar-wrap:hover::before{
    opacity: 0.9;
}
@keyframes shake {
    0% { transform: scale(1.08) rotate(0deg); }
    20% { transform: scale(1.08) rotate(-10deg); }
    40% { transform: scale(1.08) rotate(10deg); }
    60% { transform: scale(1.08) rotate(-6deg); }
    80% { transform: scale(1.08) rotate(6deg); }
    100% { transform: scale(1.08) rotate(0deg); }
}
@keyframes rotateGlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
.username{
    margin-top:16px;
    font-size:22px;
    font-weight:600;
    color:#222;
}
.bio{
    color:#666;
    margin:8px 0 16px;
    font-size:14px;
}
.tag-group{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:flex-start;
    margin-top:8px;
}
.tag{
    background:#fff2bc;
    color:#443300;
    padding:5px 12px;
    border-radius:999px;
    font-size:13px;
}
/* 独立横幅卡片 */
.banner-card{
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
    margin-bottom:18px;
}
.banner{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
}
/* 三栏统计卡片 */
.row-3{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
    gap:16px;
    margin-bottom:18px;
}
.stat-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:18px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.stat-card h3{
    font-size:15px;
    color:#555;
    margin-bottom:12px;
    font-weight:500;
}
.stat-value{
    font-size:26px;
    font-weight:700;
    color:#7c3aed;
}
.stat-desc{
    font-size:13px;
    color:#777;
    margin-top:6px;
}
.gh-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    text-align:center;
    padding:10px 0;
}
.gh-grid .num{
    font-size:20px;
    font-weight:700;
    color:#222;
}
.gh-grid .label{
    font-size:12px;
    color:#777;
    margin-top:2px;
}
.gh-tip{
    font-size:12px;
    color:#999;
    text-align:center;
    margin-top:8px;
}
.lang-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:10px 0;
    font-size:14px;
}
.lang-name{
    width:80px;
    color:#444;
}
.lang-bar{
    flex:1;
    height:8px;
    background:#eee;
    border-radius:99px;
    overflow:hidden;
}
.lang-fill{
    height:100%;
    border-radius:99px;
}
.lang-percent{
    width:40px;
    text-align:right;
    color:#666;
}
/* 仓库动态表格 */
.repo-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:18px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.repo-card h3{
    font-size:15px;
    color:#555;
    margin-bottom:12px;
    font-weight:500;
    display:flex;
    justify-content:space-between;
}
.repo-table-head{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    padding:8px 0;
    font-size:12px;
    color:#999;
    border-bottom:1px solid #eee;
}
.repo-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    padding:12px 0;
    border-bottom:1px solid #f0f0f0;
    font-size:14px;
    align-items:center;
}
.repo-row:last-child{
    border-bottom:none;
}
.repo-name a{
    color:#7c3aed;
    text-decoration:none;
    font-weight:500;
}
</style>
</head>
<body>
<!-- 顶部用户信息卡片 -->
<div class="profile-card">
    <div class="avatar-wrap">
        <img class="avatar" src="AI_1787483789040.png" alt="头像">
     </div>
     <div class="username">chaosjacker</div>
     <div class="bio" id="bio">ACG爱好者 | 前端摸鱼中</div>
     <div class="tag-group">
         <span class="tag">前端</span>
         <span class="tag">GitHub</span>
         <span class="tag">ACG</span>
         <span class="tag">JavaScript</span>
     </div>
 </div>
 <!-- 独立横幅卡片 -->
 <div class="banner-card">
     <img class="banner" src="AI_1790003503497.png" alt="横幅">
 </div>
 <!-- 三个统计卡片 -->
 <div class="row-3">
     <div class="stat-card">
         <h3>摸鱼状态</h3>
         <div class="stat-value" id="lastCommitTime">0时0分0秒</div>
         <div class="stat-desc" id="lastCommitDesc">最后一次提交：加载中...</div>
     </div>
     <div class="stat-card">
         <h3>GitHub 概览</h3>
         <div class="gh-grid">
             <div>
                 <div class="num" id="repoNum">--</div>
                 <div class="label">仓库</div>
             </div>
             <div>
                 <div class="num" id="starNum">--</div>
                 <div class="label">Star</div>
             </div>
             <div>
                 <div class="num" id="followerNum">--</div>
                 <div class="label">关注者</div>
             </div>
         </div>
         <div class="gh-tip">数据来自 GitHub API</div>
     </div>
     <div class="stat-card">
         <h3>常用语言</h3>
         <div class="lang-row">
             <div class="lang-name">JavaScript</div>
             <div class="lang-bar"><div class="lang-fill" style="width:50%;background:#f1e05a"></div></div>
             <div class="lang-percent">50%</div>
         </div>
         <div class="lang-row">
             <div class="lang-name">CSS</div>
             <div class="lang-bar"><div class="lang-fill" style="width:30%;background:#563d7c"></div></div>
             <div class="lang-percent">30%</div>
         </div>
         <div class="lang-row">
             <div class="lang-name">HTML</div>
             <div class="lang-bar"><div class="lang-fill" style="width:20%;background:#e34c26"></div></div>
             <div class="lang-percent">20%</div>
         </div>
     </div>
 </div>
 <!-- 仓库动态表格 -->
 <div class="repo-card">
     <h3>仓库动态 <span style="font-size:12px;color:#888">更新中...</span></h3>
     <div class="repo-table-head">
         <div>仓库</div>
         <div>语言</div>
         <div>Star</div>
         <div>最近提交</div>
     </div>
     <div id="repoListBox">
         <div class="repo-row">
             <div class="repo-name"><a href="https://github.com/chaosjacker" target="_blank">加载仓库列表...</a></div>
             <div>-</div>
             <div>-</div>
             <div>-</div>
         </div>
     </div>
 </div>
 <script>
 const USER = "chaosjacker";
 let lastCommitDate = new Date("2026-09-24T21:00:00+08:00");
 let timerInterval = null;
 function startTimer(){
     if(timerInterval) clearInterval(timerInterval);
     function update(){
         const sec = Math.floor((Date.now() - lastCommitDate.getTime()) / 1000);
         const d = Math.floor(sec / 86400);
         const h = Math.floor((sec % 86400) / 3600);
         const m = Math.floor((sec % 3600) / 60);
         const s = sec % 60;
         let text = "";
         if(d>0) text += d + "天";
         text += h + "时" + m + "分" + s + "秒";
         document.getElementById("lastCommitTime").innerText = text;
     }
     update();
     timerInterval = setInterval(update, 1000);
 }
 startTimer();
 async function autoFetchGithubData(){
     try{
         const controller = new AbortController();
         const timeout = setTimeout(()=>controller.abort(), 10000);
         const userRes = await fetch("https://api.github.com/users/" + USER, {signal: controller.signal});
         const userData = await userRes.json();
         document.getElementById("bio").innerText = userData.bio || "ACG爱好者 | 前端摸鱼中";
         document.getElementById("repoNum").innerText = userData.public_repos;
         document.getElementById("followerNum").innerText = userData.followers;
         const repoRes = await fetch("https://api.github.com/users/" + USER + "/repos?per_page=100&sort=pushed", {signal: controller.signal});
         const repos = await repoRes.json();
         let totalStar = 0;
         repos.forEach(r => totalStar += r.stargazers_count);
         document.getElementById("starNum").innerText = totalStar;
         if(repos[0]?.pushed_at){
             lastCommitDate = new Date(repos[0].pushed_at);
             startTimer();
             const dateStr = new Date(repos[0].pushed_at).toLocaleString();
             document.getElementById("lastCommitDesc").innerText = "最后一次提交：" + dateStr;
         }
         let repoHtml = "";
         repos.slice(0,5).forEach(r=>{
             const pushDate = new Date(r.pushed_at).toLocaleDateString();
             repoHtml += `
             <div class="repo-row">
                 <div class="repo-name"><a href="${r.html_url}" target="_blank">${r.name}</a></div>
                 <div>${r.language || "-"}</div>
                 <div>⭐${r.stargazers_count}</div>
                 <div>${pushDate}</div>
             </div>`;
         });
         document.getElementById("repoListBox").innerHTML = repoHtml;
         clearTimeout(timeout);
     }catch(e){
         document.getElementById("repoNum").innerText = "12";
         document.getElementById("starNum").innerText = "34";
         document.getElementById("followerNum").innerText = "5";
         document.getElementById("lastCommitDesc").innerText = "最后一次提交：2026-09-24 21:00";
         document.getElementById("repoListBox").innerHTML = `
         <div class="repo-row">
             <div class="repo-name"><a href="https://github.com/chaosjacker" target="_blank">chaosjacker.github.io</a></div>
             <div>JavaScript</div>
             <div>⭐2</div>
             <div>2026-09-24</div>
         </div>`;
     }
 }
 autoFetchGithubData();
 </script>
 </body>
 </html>
