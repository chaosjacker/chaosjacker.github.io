<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 GitHub 主页</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
        background-color: #fcfaff;
        background-image: url("torinoaqua_394aa6b23d9042e18c0026784cad3fbf.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: #333;
        padding: 16px;
        max-width: 1024px;
        margin: 0 auto;
    }

    /* ===== 顶部个人卡片 ===== */
    .profile-card {
        background: #ffffff;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.08);
        margin-bottom: 20px;
    }
    .banner-img {
        width: 100%;
        height: 340px;
        object-fit: cover;
        display: block;
        background: linear-gradient(135deg, #e9d8fd, #d6bcfa);
    }
    .profile-info {
        padding: 20px 24px 24px;
        position: relative;
        z-index: 1;
    }
    .profile-info h2 {
        font-size: 22px;
        margin-bottom: 6px;
        color: #222;
    }
    .bio-text {
        color: #666;
        margin-bottom: 14px;
        line-height: 1.6;
    }
    .tag-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .tag {
        background-color: #efe6f9;
        color: #6b46c1;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
    }

    /* ===== 头像框（带呼吸光晕 + hover 加速） ===== */
    .avatar-frame {
        --breathe-duration: 3s;

        width: 116px;
        height: 116px;
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(135deg, #a78bfa, #7c3aed, #d8b4fe, #6b46c1);
        background-size: 300% 300%;
        box-shadow: 0 8px 22px rgba(107, 70, 193, 0.28);
        margin-top: -72px;
        margin-bottom: 14px;
        position: relative;
        z-index: 2;
        transition: transform 0.35s ease, box-shadow 0.35s ease;
        animation: gradient-flow 6s ease infinite;
    }

    .avatar-frame::before,
    .avatar-frame::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: linear-gradient(135deg, #a78bfa, #7c3aed, #d8b4fe);
        z-index: -1;
        animation: breathe var(--breathe-duration) ease-in-out infinite;
        transition: opacity 0.3s ease;
    }
    .avatar-frame::after {
        animation-delay: 1.5s;
    }

    .avatar-frame:hover {
        --breathe-duration: 1.1s;
        transform: scale(1.05) rotate(-2deg);
        box-shadow: 0 12px 30px rgba(107, 70, 193, 0.45);
    }
    .avatar-frame:hover::before,
    .avatar-frame:hover::after {
        animation-name: breathe-strong;
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        border: 3px solid #fff;
        background: #fff;
        position: relative;
        z-index: 1;
    }

    /* ===== 动画 ===== */
    @keyframes breathe {
        0%   { transform: scale(1);    opacity: 0.55; }
        50%  { transform: scale(1.22); opacity: 0;    }
        100% { transform: scale(1);    opacity: 0;    }
    }
    @keyframes breathe-strong {
        0%   { transform: scale(1);    opacity: 0.85; }
        50%  { transform: scale(1.28); opacity: 0;    }
        100% { transform: scale(1);    opacity: 0;    }
    }
    @keyframes gradient-flow {
        0%   { background-position: 0% 50%;   }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%;   }
    }

    /* ===== 三栏统计卡片 ===== */
    .grid-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
    }
    .stat-card {
        background: #fff;
        padding: 20px 24px;
        border-radius: 18px;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.08);
    }
    .stat-card h3 {
        font-size: 15px;
        color: #555;
        margin-bottom: 12px;
        font-weight: 600;
    }
    .stat-value {
        font-size: 28px;
        font-weight: 700;
        color: #2d3748;
        line-height: 1.2;
    }
    .stat-sub {
        font-size: 13px;
        color: #999;
        margin-top: 6px;
    }
    .stat-line {
        font-size: 14px;
        color: #555;
        line-height: 1.9;
    }
    .stat-line b {
        color: #2d3748;
    }

    /* ===== 语言占比条 ===== */
    .lang-bar-container {
        width: 100%;
        height: 10px;
        background: #f0edf5;
        border-radius: 5px;
        margin: 10px 0 8px;
        overflow: hidden;
        display: flex;
    }
    .lang-seg {
        height: 100%;
    }
    .lang-legend {
