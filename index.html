<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chaosjacker | GitHub主页</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body{
    background-color:#f7f7fb;
    background-image:url("torinoaqua_394aa6b23d9042e18c0026784cad3fbf.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    padding:16px;
    max-width:1080px;
    margin:0 auto;
}
/* 顶部用户信息白色卡片 */
.profile-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:20px;
    padding:30px 24px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
    margin-bottom:16px;
    text-align:center;
}
.avatar-wrap{
    position: relative;
    display: inline-block;
}
.avatar-wrap::before{
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff6ad5, #a78bfa, #4facfe, #43e97b, #ffd86b, #ff6ad5);
    z-index: -1;
    filter: blur(12px);
    opacity: 0;
    transition: opacity 0.3s ease;
    animation: rotateGlow 6s linear infinite;
}
.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    border:4px solid #fff;
    object-fit:cover;
    background:#fff;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    z-index: 2;
}
.avatar-wrap:hover .avatar{
    animation: shake 0.5s ease-in-out;
    box-shadow: 0 0 20px rgba(255,105,210,0.8), 0 0 40px rgba(167,139,250,0.6), 0 0 60px rgba(79,172,254,0.4);
    transform: scale(1.08) rotate(3deg);
}
.avatar-wrap:hover::before{
    opacity: 0.9;
}
@keyframes shake {
    0% { transform: scale(1.08) rotate(0deg); }
    20% { transform: scale(1.08) rotate(-10deg); }
    40% { transform: scale(1.08) rotate(10deg); }
    60% { transform: scale(1.08) rotate(-6deg); }
    80% { transform: scale(1.08) rotate(6deg); }
    100% { transform: scale(1.08) rotate(0deg); }
}
@keyframes rotateGlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
.username{
    margin-top:16px;
    font-size:22px;
    font-weight:600;
    color:#222;
}
.bio{
    color:#666;
    margin:8px 0 16px;
    font-size:14px;
}
.tag-group{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:flex-start;
    margin-top:8px;
}
.tag{
    background:#fff2bc;
    color:#443300;
    padding:5px 12px;
    border-radius:999px;
    font-size:13px;
}
/* 独立横幅卡片 */
.banner-card{
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
    margin-bottom:18px;
}
.banner{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
}
/* 三栏统计卡片 */
.row-3{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
    gap:16px;
    margin-bottom:18px;
}
.stat-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:18px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.stat-card h3{
    font-size:15px;
    color:#555;
    margin-bottom:12px;
    font-weight:500;
}
.stat-value{
    font-size:26px;
    font-weight:700;
    color:#7c3aed;
}
.stat-desc{
    font-size:13px;
    color:#777;
    margin-top:6px;
}
.gh-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    text-align:center;
    padding:10px 0;
}
.gh-grid .num{
    font-size:20px;
    font-weight:700;
    color:#222;
}
.gh-grid .label{
    font-size:12px;
    color:#777;
    margin-top:2px;
}
.gh-tip{
    font-size:12px;
    color:#999;
    text-align:center;
    margin-top:8px;
}
.lang-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:10px 0;
    font-size:14px;
}
.lang-name{
    width:80px;
    color:#444;
}
.lang-bar{
    flex:1;
    height:8px;
    background:#eee;
    border-radius:99px;
    overflow:hidden;
}
.lang-fill{
    height:100%;
    border-radius:99px;
}
.lang-percent{
    width:40px;
    text-align:right;
    color:#666;
}
/* 仓库动态表格 */
.repo-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:18px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.repo-card h3{
    font-size:15px;
    color:#555;
    margin-bottom:12px;
    font-weight:500;
    display:flex;
    justify-content:space-between;
}
.repo-table-head{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    padding:8px 0;
    font-size:12px;
    color:#999;
    border-bottom:1px solid #eee;
}
.repo-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    padding:12px 0;
    border-bottom:1px solid #f0f0f0;
    font-size:14px;
    align-items:center;
}
.repo-row:last-child{
    border-bottom:none;
}
.repo-name a{
    color:#7c3aed;
    text-decoration:none;
    font-weight:500;
}
</style>
</head>
<body>
<!-- 顶部用户信息卡片 -->
<div class="profile-card">
    <div class="avatar-wrap">
