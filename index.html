<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 GitHub 主页</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
        background-color: #fcfaff;
        background-image: url("torinoaqua_394aa6b23d9042e18c0026784cad3fbf.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: #333;
        padding: 16px;
        max-width: 1024px;
        margin: 0 auto;
    }

    /* ===== 顶部个人卡片 ===== */
    .profile-card {
        background: #ffffff;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 2px 14px rgba(0,0,0,0.08);
        margin-bottom: 20px;
    }
    .banner-img {
        width: 100%;
        height: 340px;
        object-fit: cover;
        display: block;
        background: linear-gradient(135deg, #e9d8fd, #d6bcfa);
    }
    .profile-info {
        padding: 20px 24px;
        position: relative;
        z-index: 1;
    }
    .profile-info h2 {
        font-size: 22px;
        margin-bottom: 6px;
        color: #222;
    }
    .bio-text {
        color: #666;
        margin-bottom: 14px;
        line-height: 1.6;
    }
    .tag-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .tag {
        background-color: #efe6f9;
        color: #6b46c1;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
    }

    /* ===== 头像 光晕动画 ===== */
    .avatar-frame {
        --breathe-time: 3s;
        width: 116px;
        height: 116px;
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(135deg, #a78bfa, #7c3aed, #d8b4fe, #6b46c1);
        background-size: 300% 300%;
        box-shadow: 0 8px 22px rgba(107, 70, 193, 0.28);
        margin-top: -72px;
        margin-bottom: 14px;
        position: relative;
        z-index: 2;
        transition: transform 0.35s ease, box-shadow 0.35s ease;
        animation: gradient-rotate var(--breathe-time) ease infinite;
    }
    .avatar-frame:hover {
        --breathe-time: 1.1s;
        transform: scale(1.05) rotate(-2deg);
        box-shadow: 0 12px 30px rgba(107, 70, 193, 0.45);
    }
    @keyframes gradient-rotate {
        0%{background-position:0% 50%}
        50%{background-position:100% 50%}
        100%{background-position:0% 50%}
    }
    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        border: 3px solid #fff;
        background: #fff;
    }

    /* ===== 三栏卡片区域 ===== */
    .grid-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
    }
    .stat-card {
        background: #fff;
        padding: 20px 24px;
        border-radius: 18px;
        box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    }
    .stat-card h3 {
        font-size: 15px;
        color: #555;
        margin-bottom: 12px;
    }
    .stat-value {
        font-size: 28px;
        font-weight: 700;
        color: #2d3748;
        line-height: 1.2;
    }
    .stat-desc {
        font-size: 13px;
        color: #999;
        margin-top: 6px;
    }
    .stat-text {
        font-size:14px;
        color:#555;
        line-height:1.9;
    }
    /* 语言进度条 */
    .lang-bar-wrap {
        width:100%;
        height:10px;
        background:#f0edf5;
        border-radius:5px;
        margin:10px 0 8px;
        overflow:hidden;
        display:flex;
    }
    .lang-seg {
        height:100%;
    }
    .lang-label-group {
        display:flex;
        gap:12px;
        flex-wrap:wrap;
        font-size:13px;
        color:#555;
    }
</style>
</head>
<body>

<!-- 顶部横幅卡片 -->
<div class="profile-card">
    <img class="banner-img" src="banner.jpg" alt="横幅">
    <div class="profile-info">
        <div class="avatar-frame">
            <img class="avatar-img" src="avatar.png" alt="头像">
        </div>
        <h2>你的名字</h2>
        <p class="bio-text">简介文字写在这里</p>
        <div class="tag-group">
            <span class="tag">标签1</span>
            <span class="tag">标签2</span>
            <span class="tag">标签3</span>
        </div>
    </div>
</div>

<!-- 三栏卡片 -->
<div class="grid-row">
    <div class="stat-card">
        <h3>关于我</h3>
        <p class="stat-text">这里写自我介绍内容</p>
    </div>
    <div class="stat-card">
        <h3>项目统计</h3>
        <div class="stat-value">6</div>
        <div class="stat-desc">公开仓库</div>
    </div>
    <div class="stat-card">
        <h3>常用语言</h3>
        <div class="lang-bar-wrap">
            <div class="lang-seg" style="width:60%;background:#7c3aed;"></div>
            <div class="lang-seg" style="width:30%;background:#a78bfa;">
