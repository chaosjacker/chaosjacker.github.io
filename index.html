<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chaosjacker | GitHub主页</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body{
    background-color:#f7f7fb;
    background-image:url("torinoaqua_394aa6b23d9042e18c0026784cad3fbf.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    padding:16px;
    max-width:1080px;
    margin:0 auto;
}
/* 顶部用户卡片 */
.top-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
    margin-bottom:18px;
}
.banner{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
}
.user-info{
    padding:0 24px 20px;
    position:relative;
}
.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    border:4px solid #fff;
    margin-top:-55px;
    object-fit:cover;
    background:#fff;
}
.username{
    margin-top:10px;
    font-size:22px;
    font-weight:600;
    color:#222;
}
.bio{
    color:#666;
    margin:6px 0 14px;
    font-size:14px;
}
.tag-group{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}
.tag{
    background:#fff2bc;
    color:#443300;
    padding:4px 10px;
    border-radius:999px;
    font-size:13px;
}
/* 三栏卡片容器 */
.row-3{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:16px;
    margin-bottom:18px;
}
.stat-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:18px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.stat-card h3{
    font-size:15px;
    color:#555;
    margin-bottom:12px;
    font-weight:500;
}
.stat-value{
    font-size:28px;
    font-weight:700;
    color:#222;
}
.stat-desc{
    font-size:13px;
    color:#777;
    margin-top:4px;
}
/* 语言进度条 */
.lang-wrap{
    width:100%;
    height:10px;
    background:#e9e9f0;
    border-radius:99px;
    display:flex;
    overflow:hidden;
    margin:10px 0 8px;
}
.lang-bar{
    height:100%;
}
.lang-label{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    font-size:13px;
    color:#555;
}
/* 仓库列表卡片 */
.repo-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:18px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.repo-card h3{
    font-size:15px;
    color:#555;
    margin-bottom:12px;
    font-weight:500;
    display:flex;
    justify-content:space-between;
}
.repo-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #eee;
}
.repo-item:last-child{
    border-bottom:none;
}
.repo-left a{
    font-weight:600;
    color:#2b6cb0;
    text-decoration:none;
}
.repo-left p{
    font-size:12px;
    color:#777;
    margin-top:3px;
}
.repo-right{
    text-align:right;
    font-size:12px;
    color:#666;
}
</style>
</head>
<body>
<div class="top-card">
    <img class="banner" src="AI_1790003503497.png" alt="横幅">
    <div class="user-info">
        <img class="avatar" src="AI_1787483789040.png" alt="头像">
        <div class="username">chaosjacker</div>
        <div class="bio" id="bio">加载简介...</div>
        <div class="tag-group" id="tagGroup">
            <span class="tag">前端</span>
            <span class="tag">GitHub</span>
            <span class="tag">ACG</span>
            <span class="tag">JavaScript</span>
        </div>
    </div>
</div>

<div class="row-3">
    <div class="stat-card">
        <h3>摸鱼状态</h3>
        <div class="stat-value" id="lastCommitTime">--</div>
        <div class="stat-desc">最后一次提交</div>
    </div>
    <div class="stat-card">
        <h3>GitHub概览</h3>
        <div class="stat-value"><span id="repoNum">0</span> / <span id="starNum">0</span> / <span id="followerNum">0</span></div>
        <div class="stat-desc">仓库 · Star · 关注者</div>
    </div>
    <div class="stat-card">
        <h3>常用语言</h3>
        <div class="lang-wrap" id="langBarBox"></div>
        <div class="lang-label" id="langLabelBox"></div>
    </div>
</div>

<div class="repo-card">
    <h3>仓库动态 <span style="font-size:12px;color:#888">更新于<span id="updateTime"></span></span></h3>
    <div id="repoListBox"></div>
</div>
