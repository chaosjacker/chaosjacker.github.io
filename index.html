<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chaosjacker | GitHub主页</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body{
    background-color:#f7f7fb;
    background-image:url("torinoaqua_394aa6b23d9042e18c0026784cad3fbf.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    padding:16px;
    max-width:1080px;
    margin:0 auto;
}
.top-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
    margin-bottom:18px;
}
.banner{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
}
.user-info{
    padding:0 24px 20px;
    position:relative;
}
.avatar-wrap{
    position: relative;
    display: inline-block;
}
.avatar-wrap::before{
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff6ad5, #a78bfa, #4facfe, #43e97b, #ffd86b, #ff6ad5);
    z-index: -1;
    filter: blur(12px);
    opacity: 0;
    transition: opacity 0.3s ease;
    animation: rotateGlow 6s linear infinite;
}
.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    border:4px solid #fff;
    margin-top:-55px;
    object-fit:cover;
    background:#fff;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    z-index: 2;
}
.avatar-wrap:hover .avatar{
    animation: shake 0.5s ease-in-out;
    box-shadow: 0 0 20px rgba(255,105,210,0.8), 0 0 40px rgba(167,139,250,0.6), 0 0 60px rgba(79,172,254,0.4);
    transform: scale(1.08) rotate(3deg);
}
.avatar-wrap:hover::before{
    opacity: 0.9;
}
@keyframes shake {
    0% { transform: scale(1.08) rotate(0deg); }
    20% { transform: scale(1.08) rotate(-10deg); }
    40% { transform: scale(1.08) rotate(10deg); }
    60% { transform: scale(1.08) rotate(-6deg); }
    80% { transform: scale(1.08) rotate(6deg); }
    100% { transform: scale(1.08) rotate(0deg); }
}
@keyframes rotateGlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
.username{
    margin-top:10px;
    font-size:22px;
    font-weight:600;
    color:#222;
}
.bio{
    color:#666;
    margin:6px 0 14px;
    font-size:14px;
}
.tag-group{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}
.tag{
    background:#fff2bc;
    color:#443300;
    padding:4px 10px;
    border-radius:999px;
    font-size:13px;
}
.row-3{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:16px;
    margin-bottom:18px;
}
.stat-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:18px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.stat-card h3{
    font-size:15px;
    color:#555;
    margin-bottom:12px;
    font-weight:500;
}
.stat-value{
    font-size:28px;
    font-weight:700;
    color:#222;
}
.stat-desc{
    font-size:13px;
    color:#777;
    margin-top:4px;
}
.lang-wrap{
    width:100%;
    height:10px;
    background:#e9e9f0;
    border-radius:99px;
    display:flex;
    overflow:hidden;
    margin:10px 0 8px;
}
.lang-bar{
    height:100%;
}
.lang-label{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    font-size:13px;
    color:#555;
}
.repo-card{
    background:#ffffffdd;
    backdrop-filter:blur(8px);
    border-radius:18px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.repo-card h3{
    font-size:15px;
    color:#555;
    margin-bottom:12px;
    font-weight:500;
    display:flex;
    justify-content:space-between;
}
.repo-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #eee;
}
.repo-item:last-child{
    border-bottom:none;
}
.repo-left a{
    font-weight:600;
    color:#2b6cb0;
    text-decoration:none;
}
.repo-left p{
    font-size:12px;
    color:#777;
    margin-top:3px;
}
.repo-right{
    text-align:right;
    font-size:12px;
    color:#666;
}
</style>
</head>
<body>
<div class="top-card">
    <img class="banner" src="AI_1790003503497.png" alt="横幅">
    <div class="user-info">
        <div class="avatar-wrap">
            <img class="avatar" src="AI_1787483789040.png" alt="头像">
        </div>
        <div class="username">chaosjacker</div>
        <div class="bio" id="bio">ACG爱好者 | 前端摸鱼中</div>
        <div class="tag-group">
            <span class="tag">前端</span>
            <span class="tag">GitHub</span>
            <span class="tag">ACG</span>
            <span class="tag">JavaScript</span>
        </div>
    </div>
</div>

<div class="row-3">
    <div class="stat-card">
        <h3>摸鱼状态</h3>
        <div class="stat-value" id="lastCommitTime">0时0分0秒</div>
        <div class="stat-desc">最后一次提交</div>
    </div>
    <div class="stat-card">
        <h3>GitH
