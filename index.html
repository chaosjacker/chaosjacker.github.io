<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 GitHub 主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #fcfaff;
            color: #333;
            padding: 16px;
            max-width: 1024px;
            margin: 0 auto;
        }

        /* ===== 顶部个人卡片 ===== */
        .profile-card {
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        .banner-img {
            width: 100%;
            height: 340px;
            object-fit: cover;
            display: block;
        }
        .profile-info {
            padding: 20px 24px 24px;
        }
        .profile-info h2 {
            font-size: 22px;
            margin-bottom: 6px;
            color: #222;
        }
        .bio-text {
            color: #666;
            margin-bottom: 14px;
            line-height: 1.6;
        }
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background-color: #efe6f9;
            color: #6b46c1;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
        }

        /* ===== 三栏统计卡片 ===== */
        .grid-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff;
            padding: 20px 24px;
            border-radius: 18px;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.08);
        }
        .stat-card h3 {
            font-size: 15px;
            color: #555;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            line-height: 1.2;
        }
        .stat-sub {
            font-size: 13px;
            color: #999;
            margin-top: 6px;
        }
        .stat-line {
            font-size: 14px;
            color: #555;
            line-height: 1.9;
        }
        .stat-line b {
            color: #2d3748;
        }

        /* ===== 语言占比条 ===== */
        .lang-bar-container {
            width: 100%;
            height: 10px;
            background: #f0edf5;
            border-radius: 5px;
            margin: 10px 0 8px;
            overflow: hidden;
            display: flex;
        }
        .lang-seg {
            height: 100%;
        }
        .lang-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            font-size: 13px;
            color: #666;
        }
        .lang-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }

        /* ===== 仓库动态列表 ===== */
        .repo-card {
            background: #fff;
            border-radius: 18px;
            padding: 20px 24px;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.08);
        }
        .repo-card h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
        }
        .repo-card .update-time {
            float: right;
            font-size: 12px;
            color: #aaa;
            font-weight: 400;
        }
        .repo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f3f0f8;
        }
        .repo-item:last-child {
            border-bottom: none;
        }
        .repo-name {
            font-size: 15px;
            font-weight: 600;
            color: #6b46c1;
        }
        .repo-desc {
            font-size: 13px;
            color: #888;
            margin-top: 3px;
        }
        .repo-meta {
            text-align: right;
            font-size: 13px;
            color: #888;
        }
        .repo-lang {
            display: inline-block;
            font-size: 12px;
            color: #666;
            background: #f5f2fa;
            padding: 2px 8px;
            border-radius: 99px;
            margin-top: 4px;
        }

        /* ===== 页脚 ===== */
        footer {
            text-align: center;
            padding: 24px 0 8px;
            font-size: 13px;
            color: #aaa;
        }
        footer a {
            color: #6b46c1;
            text-decoration: none;
        }

        /* ===== 移动端适配 ===== */
        @media (max-width: 600px) {
            .banner-img { height: 200px; }
            .stat-value { font-size: 22px; }
            body { padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- ========== 顶部个人卡片 ========== -->
    <div class="profile-card">
        <!-- 替换成你自己的横幅图片链接 -->
        <img class="banner-img"
             src="https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=1200&q=80"
             alt="banner">
        <div class="profile-info">
            <h2 id="username">加载中…</h2>
            <p class="bio-text" id="bio"></p>
            <!-- 手动修改你的技术标签 -->
            <div class="tag-group" id="tagWrap">
                <span class="tag">Rust</span>
                <span class="tag">C</span>
                <span class="tag">C++</span>
                <span class="tag">Linux</span>
                <span class="tag">Arch</span>
                <span class="tag">Git</span>
                <span class="tag">AI</span>
            </div>
        </div>
    </div>

    <!-- ========== 三栏统计 ========== -->
    <div class="grid-row">
        <!-- 摸鱼状态 -->
        <div class="stat-card">
            <h3>摸鱼状态</h3>
            <div class="stat-value" id="commit-diff">--:--:--</div>
            <div class="stat-sub" id="commit-date">正在获取最近提交…</div>
        </div>

        <!-- GitHub 概览 -->
        <div class="stat-card">
            <h3>GitHub 概览</h3>
            <div class="stat-line">仓库　<b id="repo-count">-</b></div>
            <div class="stat-line">Star　<b id="star-count">-</b></div>
            <div class="stat-line">关注者　<b id="follower-count">-</b></div>
        </div>

        <!-- 常用语言（自动统计） -->
        <div class="stat-card">
            <h3>常用语言</h3>
            <div class="lang-bar-container" id="lang-bar">
                <div class="lang-seg" style="width:100%;background:#e0d8ef"></div>
            </div>
            <div class="lang-legend" id="lang-legend">统计中…</div>
        </div>
    </div>

    <!-- ========== 仓库动态 ========== -->
    <div class="repo-card">
        <h3>仓库动态 <span class="update-time">更新于 <span id="update-time">--:--</span></span></h3>
        <div id="repo-list">正在加载仓库列表…</div>
    </div>

    <footer>
        Built with ❤ · <a href="https://github.com/settings/pages" target="_blank">GitHub Pages</a>
    </footer>

<script>
// ================== 【必改】填入你的 GitHub 用户名 ==================
const GH_USER = "chaosjacker";
// ===================================================================

// 语言配色（按 GitHub 官方色）
const LANG_COLORS = {
    "Rust":      "#dea584",
    "JavaScript":"#f1e05a",
    "Python":    "#3572A5",
    "TypeScript":"#3178c6",
    "C++":       "#f34b7d",
    "C":         "#555555",
    "Java":      "#b07219",
    "Go":        "#00ADD8",
    "Shell":     "#89e051",
    "HTML":      "#e34c26",
    "CSS":       "#563d7c",
    "Vue":       "#41b883",
    "Jupyter Notebook": "#DA5B0B",
};
const FALLBACK_COLOR = "#9b87c4";

async function loadPage() {
    try {
        // 1) 用户信息
        const userRes = await fetch(`https://api.github.com/users/${GH_USER}`);
        const user = await userRes.json();
        document.getElementById("username").innerText = user.name || user.login;
        document.getElementById("bio").innerText = user.bio || "这个人很懒，什么都没写～";
        document.getElementById("repo-count").innerText = user.public_repos;
        document.getElementById("follower-count").innerText = user.followers;

        // 2) 仓库列表（按最近推送排序）
        const repoRes = await fetch(`https://api.github.com/users/${GH_USER}/repos?per_page=100&sort=pushed`);
        const repos = await repoRes.json();

        // 统计 Star 总数
        const totalStar = repos.reduce((sum, r) => sum + (r.stargazers_count || 0), 0);
        document.getElementById("star-count").innerText = totalStar;

        // 3) 摸鱼计时器 —— 找最近一次 push 的时间
        if (repos.length > 0) {
            const latestPush = new Date(repos[0].pushed_at);
            updateCountdown(latestPush);
            setInterval(() => updateCountdown(latestPush), 1000);
            document.getElementById("commit-date").innerText =
                `最后提交：${latestPush.toLocaleString("zh-CN")}`;
        }

        // 4) 语言占比统计
        renderLanguageStats(repos);

        // 5) 渲染最近 6 个仓库
        renderRepoList(repos.slice(0, 6));

        // 6) 更新时间
        document.getElementById("update-time").innerText =
            new Date().toLocaleTimeString("zh-CN");

    } catch (err) {
        console.error("加载失败：", err);
        document.getElementById("username").innerText = "加载失败";
        document.getElementById("bio").innerText = "请检查 GitHub 用户名是否正确，或稍后重试（GitHub API 未认证每小时限 60 次）。";
    }
}

// 摸鱼倒计时
function updateCountdown(pushTime) {
    const diff = Math.max(0, Math.floor((new Date() - pushTime) / 1000));
    const hh = String(Math.floor(diff / 3600)).padStart(2, "0");
    const mm = String(Math.floor((diff % 3600) / 60)).padStart(2, "0");
    const ss = String(diff % 60).padStart(2, "0");
    document.getElementById("commit-diff").innerText = `${hh}:${mm}:${ss}`;
}

// 语言占比
function renderLanguageStats(repos) {
    const langBytes = {};
    repos.forEach(r => {
        if (r.language) langBytes[r.language] = (langBytes[r.language] || 0) + (r.size || 1);
    });
    const entries = Object.entries(langBytes).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const total = entries.reduce((s, [, v]) => s + v, 0) || 1;

    const bar = document.getElementById("lang-bar");
    const legend = document.getElementById("lang-legend");
    bar.innerHTML = "";
    legend.innerHTML = "";

    entries.forEach(([lang, bytes]) => {
        const pct = ((bytes / total) * 100).toFixed(1);
        const color = LANG_COLORS[lang] || FALLBACK_COLOR;

        const seg = document.createElement("div");
        seg.className = "lang-seg";
        seg.style.width = pct + "%";
        seg.style.background = color;
        bar.appendChild(seg);

        legend.innerHTML +=
            `<span><span class="lang-dot" style="background:${color}"></span>${lang} ${pct}%</span>`;
    });
}

// 仓库列表
function renderRepoList(repos) {
    const wrap = document.getElementById("repo-list");
    wrap.innerHTML = repos.map(r => `
        <div class="repo-item">
            <div>
                <div class="repo-name"><a href="${r.html_url}" target="_blank" style="color:#6b46c1;text-decoration:none">${r.name}</a></div>
                <div class="repo-desc">${r.description || "暂无描述"}</div>
                ${r.language ? `<span class="repo-lang">${r.language}</span>` : ""}
            </div>
            <div class="repo-meta">
                ⭐ ${r.stargazers_count}<br>
                <small>${new Date(r.pushed_at).toLocaleDateString("zh-CN")}</small>
            </div>
        </div>
    `).join("");
}

loadPage();
</script>
</body>
</html>
